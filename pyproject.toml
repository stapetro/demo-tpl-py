[project]
name = "demo-tpl-py"
version = "0.1.0"
description = "Demo template for python backend"
authors = [{ name = "Stanislav Petrov", email = "stanislav.i.petrov@gmail.com" }]
requires-python = ">=3.14,<4"
license = "MIT"
dependencies = [
    "ecs-logging>=2.1.0,<3",
    "fastapi",
    "httpx[http2]>=0.28.1,<1",
    "logfire[fastapi]",
    "passlib[bcrypt]",
    "pip-system-certs",
    "pydantic[email]>=2.5.2,<3",
    "pydantic-settings>=2.0.3,<3",
    "python-jose[cryptography]",
    "uvicorn[standard]>=0.44.0,<1",
]

[tool.black]
exclude = '(\.git|\.mypy_cache|\.venv)'
include = '\.pyi?$'
target-version = ['py314']
line-length = 88

[dependency-groups]
dev = [
    "anyio>=4.12.0,<5",
    "autoflake>=2.0.0",
    "black[d]>=26.3.0",
    "isort>=8.0.0",
    "mypy>=2",
    "pre-commit>=4.0.1,<5",
    "pylint>=4.0.0",
    "pylint-pydantic",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
]

[tool.isort]
profile = "black"

[tool.uv]
package = false

[tool.pylint.master]
extension-pkg-allow-list = ["pydantic"]
fail-under = "9"
ignore = [
]
load-plugins = ["pylint.extensions.no_self_use", "pylint_pydantic"]

[tool.pylint.format]
max-line-length = "88"

#[tool.pylint.messages_control]
#disable = "bad-whitespace, trailing-whitespace"

[tool.pylint.miscellaneous]
notes = "FIXME,XXX,TODO,TODO,fixme,todo,TODO:"

[tool.pylint.design]
min-public-methods = 1
#max-attributes = 8

[tool.pytest.ini_options]
addopts = "--strict-markers"
junit_family = "xunit2"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
log_file_format = "%(asctime)s:%(name)s:%(funcName)s():%(levelname)s:%(message)s"
log_format = "%(asctime)s:%(name)s:%(funcName)s():%(levelname)s:%(message)s"
markers = [
    "unit: marks tests as unit tests",
    "api: marks tests as api tests",
    "integration: marks tests as integration with other components",
]
testpaths = ["tests"]

[tool.coverage.report]
omit = [
    "**/__init__.py",
    ".mypy_cache",
    "**/tests/*",
    "**/src/run_server.py", # omit entry point files
]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
]

[tool.coverage.run]
omit = ["*/__init__.py", ".mypy_cache", ".reports", ".git"]

[tool.mypy]
plugins = "pydantic.mypy"
ignore_missing_imports = "true"
disallow_untyped_defs = "true"
show_error_codes = "true"
